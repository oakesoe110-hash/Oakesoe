<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        font-family: "Candara", sans-serif;
      }
      main {
        text-align: center;
        background-color: black;
        width: 100%;
        height: 100vh;
        color: white;
      }
      h1 {
        font-size: 78px;
        padding: 200px 0;
      }

      p {
        font-size: 40px;
      }
      button {
        font-size: 30px;
        padding: 10px 20px;
        color: black;
        transition: 0.6s linear;
      }

      button:hover {
        background-color: rgb(22, 12, 210);
      }
      .active {
        color: green;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="header">DOM</h1>
      <p class="page">Document Object Model</p>
      <button class="mybut" onclick="changeColor()">Click</button>
    </main>
    <script>
      let title = document.querySelector(".header");
      let pag = document.querySelector(".page");
      let butt = document.querySelector(".mybut");

      butt.addEventListener("click", function () {
        pag.classList.add("active");
        title.classList.add("active");
      });
      function changeColor() {
        if (title.style.color === "green" && pag.style.color === "green") {
          title.style.color = "white";
          pag.style.color = "white";
        } else {
          title.style.color = "green";
          pag.style.color = "green";
        }
      }
    </script>
  </body>
</html>
